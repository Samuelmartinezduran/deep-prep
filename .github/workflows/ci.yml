name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tipos y pruebas)
    # Windows a propósito: grabacion.py y recolector.py importan msvcrt al cargarse, y el código usa
    # ctypes.windll y subprocess.CREATE_NO_WINDOW. Las pruebas no tienen sentido en Linux.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1" # igual que `py -X utf8`: textos en español sin depender de la página de códigos
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el paquete y las herramientas
        id: instalar
        run: python -m pip install -e ".[dev]"

      # Los pasos de revisión se ejecutan todos aunque falle uno, para ver todos los problemas de una vez.
      - name: Formato (ruff format)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: ruff format --check --diff .

      - name: Lint (ruff check)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: ruff check --output-format=github .

      - name: Tipos (mypy)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: mypy

      - name: Pruebas con cobertura
        id: pruebas
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: python -m coverage run -m unittest discover -s tests -t . -v

      - name: Resumen de cobertura
        if: ${{ !cancelled() && steps.pruebas.outcome != 'skipped' }}
        run: |
          {
            echo "## Cobertura"
            python -m coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cobertura mínima (fail_under de pyproject.toml)
        if: ${{ !cancelled() && steps.pruebas.outcome == 'success' }}
        run: python -m coverage report

  # Panel web: cuando haya pruebas de JavaScript (node --test), quitar los comentarios.
